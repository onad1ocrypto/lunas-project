<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lunas — Design Prototype</title>
<style>
  :root{
    --paper:#F6F1E7; --paper-2:#EEE6D4; --card:#FFFDF8;
    --ink:#1B2A41; --ink-soft:#56647C; --ink-faint:#8A94A6;
    --line:rgba(27,42,65,.12);
    --stamp:#C8372D; --stamp-soft:rgba(200,55,45,.10);
    --green:#1F7A5A; --green-soft:rgba(31,122,90,.12);
    --gold:#F2B33D; --night:#121C2B;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --ease:cubic-bezier(.65,0,.35,1);
    --spring:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--sans);color:var(--ink);background:var(--paper);
    background-image:radial-gradient(rgba(27,42,65,.07) 1px,transparent 1px);
    background-size:20px 20px;min-height:100vh;
  }
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 24px 40px}

  /* ---------- Header ---------- */
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
  .logo{display:flex;align-items:center;gap:10px}
  .mark{width:34px;height:34px;border:2.5px solid var(--stamp);border-radius:8px;display:grid;place-items:center;
        color:var(--stamp);font-family:var(--serif);font-weight:700;font-size:19px;transform:rotate(-8deg)}
  .logo b{font-family:var(--serif);font-size:24px;letter-spacing:.2px}
  .logo span{font-size:12.5px;color:var(--ink-soft);display:block;margin-top:-2px}
  .steps{display:flex;gap:6px;flex-wrap:wrap}
  .steps button{font-size:12.5px;padding:7px 12px;border-radius:999px;color:var(--ink-soft);border:1px solid transparent;transition:.25s}
  .steps button.on{background:var(--ink);color:var(--paper)}
  .steps button.done{color:var(--green)}
  .steps button:hover:not(.on){border-color:var(--line)}

  /* ---------- Money rail ---------- */
  .rail{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;position:relative;
        box-shadow:0 1px 0 rgba(27,42,65,.04),0 12px 30px -18px rgba(27,42,65,.25)}
  .rail-grid{display:grid;grid-template-columns:1fr 1fr 1fr;position:relative;align-items:center}
  .track{position:absolute;left:16.66%;right:16.66%;top:22px;height:2px;
         background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}
  .track .fill{position:absolute;inset:0;width:0;background:var(--gold);transition:width 1.4s var(--ease)}
  .node{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;z-index:1}
  .avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;
          background:var(--paper-2);border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);transition:.4s}
  .node.escrow .avatar{background:var(--ink);color:var(--gold)}
  .node.lit .avatar{box-shadow:0 0 0 1px var(--gold),0 0 0 7px rgba(242,179,61,.18)}
  .node .nm{font-size:13px;font-weight:600}
  .node .loc{font-size:11.5px;color:var(--ink-soft);margin-top:-5px}
  .coin{position:absolute;top:1px;left:0;transform:translate(-50%,-50%);z-index:3;transition:left 1.4s var(--ease),opacity .4s}
  .coin .c{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#6B4A0B;
           background:radial-gradient(circle at 35% 30%,#FFE6A6,var(--gold) 55%,#C98A16);box-shadow:0 4px 12px -2px rgba(201,138,22,.6)}
  .coin.moving .c{animation:hop .7s ease-in-out infinite}
  .coin .amt{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font:600 11px var(--mono);white-space:nowrap;
             background:var(--ink);color:var(--paper);padding:2px 6px;border-radius:6px}
  .coin.ghost{opacity:0}
  .rail-status{text-align:center;margin-top:12px;font-size:13px;color:var(--ink-soft);min-height:18px}
  .rail-status b{color:var(--ink)}
  .no-anim, .no-anim *{transition:none!important}
  @keyframes hop{50%{transform:translateY(-6px) scale(1.08)}}

  /* ---------- Layout ---------- */
  .main{display:grid;grid-template-columns:1fr 330px;gap:18px;margin-top:18px}
  @media (max-width:940px){.main{grid-template-columns:1fr}}
  .stage{min-height:470px;position:relative}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;
        box-shadow:0 12px 30px -20px rgba(27,42,65,.3)}
  .eyebrow{font:600 11px var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--stamp);margin-bottom:8px}
  h2{font-family:var(--serif);font-size:28px;line-height:1.15;font-weight:600;margin-bottom:16px}
  .muted{color:var(--ink-soft);font-size:14px;line-height:1.5}
  .row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .btn{padding:12px 18px;border-radius:12px;font-weight:600;font-size:14.5px;transition:transform .15s,box-shadow .2s,opacity .2s}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--ink);color:var(--paper);box-shadow:0 8px 18px -10px var(--ink)}
  .btn.primary:hover{transform:translateY(-1px)}
  .btn.green{background:var(--green);color:#fff;box-shadow:0 8px 18px -10px var(--green)}
  .btn.ghost{border:1px solid var(--line)}
  .btn[disabled]{opacity:.35;pointer-events:none}
  .pulse{animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,122,90,.45)}70%{box-shadow:0 0 0 14px rgba(31,122,90,0)}100%{box-shadow:0 0 0 0 rgba(31,122,90,0)}}

  .enter{animation:enter .6s var(--ease) both}
  @keyframes enter{from{opacity:0;transform:translateY(14px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}

  /* ---------- Step 1: brief ---------- */
  .chat{display:flex;gap:12px;align-items:flex-start;margin:6px 0 22px}
  .chat .avatar{flex:none;width:40px;height:40px;font-size:13px}
  .bubble{background:var(--paper);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:16px 18px;
          font-size:16.5px;line-height:1.6;min-height:110px;flex:1}
  .caret{display:inline-block;width:2px;height:1.1em;background:var(--ink);vertical-align:-3px;margin-left:2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  mark.hl{background:linear-gradient(transparent 60%,rgba(242,179,61,.55) 60%);color:inherit;padding:0 1px;
          background-size:0% 100%;background-repeat:no-repeat;animation:hl .6s var(--ease) forwards}
  @keyframes hl{to{background-size:100% 100%}}

  /* ---------- Step 2: contract ---------- */
  .paper{background:#FFFEFA;border:1px solid var(--line);border-radius:6px;padding:30px 32px;position:relative;
         box-shadow:0 1px 0 #fff inset,0 24px 40px -28px rgba(27,42,65,.45);
         background-image:linear-gradient(transparent 31px,rgba(27,42,65,.045) 32px);background-size:100% 32px}
  .paper:before{content:"";position:absolute;inset:6px;border:1px solid rgba(27,42,65,.06);border-radius:3px;pointer-events:none}
  .paper-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:16px}
  .doc-label{font-family:var(--serif);font-size:24px;font-weight:700}
  .doc-id{font:12px var(--mono);color:var(--ink-soft)}
  .parties{font-size:12.5px;color:var(--ink-soft);text-align:right;line-height:1.5}
  .drafting{font:13px var(--mono);color:var(--stamp);display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .spark{display:inline-block;animation:sparkle 1.2s ease-in-out infinite}
  @keyframes sparkle{50%{transform:scale(1.35) rotate(20deg);opacity:.6}}
  .clauses{list-style:none;counter-reset:c;font-family:var(--serif);font-size:15.5px;line-height:1.55}
  .clauses li{counter-increment:c;padding:5px 0 5px 30px;position:relative;opacity:0}
  .clauses li:before{content:counter(c) ".";position:absolute;left:0;font-weight:700;color:var(--ink-soft)}
  .clauses li.in{animation:enter .55s var(--ease) forwards}
  .crit-head{display:flex;align-items:center;gap:8px;margin:18px 0 10px;font-weight:700;font-size:14px}
  .tag{font:600 10.5px var(--mono);letter-spacing:.6px;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--green-soft);color:var(--green)}
  .criteria{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  @media (max-width:560px){.criteria{grid-template-columns:1fr}}
  .chip{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px dashed rgba(27,42,65,.25);border-radius:10px;
        background:#fff;font-size:13.5px;opacity:0;transform:scale(.85)}
  .chip.in{animation:pop .5s var(--spring) forwards}
  @keyframes pop{to{opacity:1;transform:scale(1)}}
  .chip .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--paper);font-size:13px;flex:none}
  .chip small{display:block;font:11px var(--mono);color:var(--ink-faint)}
  .terms{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-soft)}
  .terms b{display:block;color:var(--ink);font-size:16px;font-family:var(--serif)}
  .sign-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:20px;gap:16px;flex-wrap:wrap}
  .sigline{width:220px;border-bottom:1px solid var(--ink);height:54px;position:relative}
  .sigline small{position:absolute;bottom:-18px;left:0;font-size:11px;color:var(--ink-faint)}
  .sigline svg{position:absolute;left:4px;bottom:2px;width:200px;height:56px}
  .sigline path{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600}
  .sigline.signed path{animation:draw 1.1s var(--ease) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}

  /* ---------- Step 3: fund ---------- */
  .fund{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center}
  @media (max-width:640px){.fund{grid-template-columns:1fr}}
  .vault{height:280px;position:relative;display:grid;place-items:center;perspective:700px}
  .env{width:220px;height:140px;position:relative;margin-top:30px}
  .env-back{position:absolute;inset:0;background:#E7DCC4;border-radius:8px}
  .env-front{position:absolute;inset:0;border-radius:8px;z-index:3;
             background:linear-gradient(to top right,#EFE5CF 50%,transparent 50%) left/50% 100% no-repeat,
                        linear-gradient(to top left,#EADFC7 50%,transparent 50%) right/50% 100% no-repeat;}
  .env-front:after{content:"";position:absolute;left:0;right:0;bottom:0;height:62%;background:#F1E8D5;border-radius:0 0 8px 8px;
                   clip-path:polygon(0 30%,50% 0,100% 30%,100% 100%,0 100%)}
  .flap{position:absolute;left:0;right:0;top:0;height:78px;background:#E2D5B8;z-index:4;transform-origin:top;
        clip-path:polygon(0 0,100% 0,50% 100%);transform:rotateX(180deg);transition:transform .7s var(--ease) ,z-index 0s .35s}
  .env.closed .flap{transform:rotateX(0);z-index:5}
  .env:not(.closed) .flap{z-index:1}
  .seal{position:absolute;left:50%;top:62px;width:46px;height:46px;margin-left:-23px;border-radius:50%;z-index:6;
        background:radial-gradient(circle at 40% 35%,#E0574B,var(--stamp) 60%,#8E2019);color:#FFE3DE;display:grid;place-items:center;
        font-family:var(--serif);font-weight:700;font-size:20px;transform:scale(0);box-shadow:0 4px 10px -3px rgba(142,32,25,.6)}
  .env.sealed .seal{animation:sealpop .5s var(--spring) forwards}
  @keyframes sealpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
  .bill{position:absolute;left:50%;top:0;width:150px;height:76px;margin-left:-75px;border-radius:6px;z-index:2;
        background:linear-gradient(135deg,#DDEFE4,#B9DCC8);border:1px solid #93C2A8;display:grid;place-items:center;
        font:700 22px var(--serif);color:var(--green);opacity:0}
  .bill.drop{animation:drop 1s var(--ease) forwards}
  @keyframes drop{0%{opacity:0;transform:translateY(-120px)}25%{opacity:1}100%{opacity:1;transform:translateY(44px)}}
  .vault-label{position:absolute;bottom:2px;font:12px var(--mono);color:var(--ink-soft);text-align:center;width:100%}
  .summary .line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .summary .line.total{border-bottom:none;font-weight:700;font-size:16px;padding-top:12px}
  .pp-btn{width:100%;margin-top:16px;background:#FFC439;border-radius:999px;padding:13px;font-weight:700;font-size:15px;color:#1B2A41;
          display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s;box-shadow:0 6px 16px -8px rgba(201,138,22,.8)}
  .pp-btn:hover{filter:brightness(1.04);transform:translateY(-1px)}
  .pp-btn i{font-style:italic;font-weight:800;color:#003087}
  .pp-btn i span{color:#0070E0}
  .spinner{width:16px;height:16px;border:2px solid rgba(27,42,65,.25);border-top-color:var(--ink);border-radius:50%;animation:rot .7s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .ok{color:var(--green);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;margin-top:12px}

  /* ---------- Step 4: verify ---------- */
  .verify{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media (max-width:700px){.verify{grid-template-columns:1fr}}
  .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;padding:4px}
  .thumb{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;border:1px solid var(--line);opacity:0;transform:scale(.8);
         transition:box-shadow .3s;perspective:400px}
  .thumb.in{animation:pop .45s var(--spring) forwards}
  .thumb svg{width:100%;height:100%;display:block;transition:transform .6s var(--ease)}
  .thumb .nm{position:absolute;left:5px;bottom:4px;font:9.5px var(--mono);color:var(--ink-soft)}
  .thumb .badge{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;
                font-size:11px;color:#fff;transform:scale(0);transition:transform .35s var(--spring)}
  .thumb.pass .badge{background:var(--green);transform:scale(1)}
  .thumb.fail{box-shadow:0 0 0 2.5px var(--stamp)}
  .thumb.fail .badge{background:var(--stamp);transform:scale(1)}
  .thumb.flip svg{transform:rotateY(90deg)}
  .more{aspect-ratio:1;border-radius:10px;border:1px dashed rgba(27,42,65,.25);display:grid;place-items:center;font:600 14px var(--mono);color:var(--ink-soft)}
  .scan{position:absolute;left:0;right:0;height:46px;top:-46px;pointer-events:none;z-index:4;
        background:linear-gradient(to bottom,transparent,rgba(31,122,90,.22) 85%,rgba(31,122,90,.9) 100%);
        border-radius:6px;opacity:0}
  .scan.go{animation:scan 1.8s var(--ease) forwards}
  @keyframes scan{0%{opacity:1;top:-46px}90%{opacity:1}100%{opacity:0;top:100%}}
  .checks{list-style:none;display:flex;flex-direction:column;gap:8px}
  .checks li{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;background:var(--paper);font-size:13.5px;transition:background .3s}
  .checks li .st{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;color:#fff;background:transparent;border:2px solid var(--line)}
  .checks li.run .st{border-color:var(--line);border-top-color:var(--ink);animation:rot .7s linear infinite}
  .checks li.pass{background:var(--green-soft)} .checks li.pass .st{background:var(--green);border-color:var(--green);animation:pop2 .35s var(--spring)}
  .checks li.fail{background:var(--stamp-soft)} .checks li.fail .st{background:var(--stamp);border-color:var(--stamp);animation:pop2 .35s var(--spring)}
  @keyframes pop2{from{transform:scale(.4)}to{transform:scale(1)}}
  .checks small{display:block;font:11px var(--mono);color:var(--ink-faint)}
  .agent-note{margin-top:14px;border-left:3px solid var(--stamp);background:#fff;padding:12px 14px;border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.5}
  .agent-note.good{border-color:var(--green)}
  .agent-note b{font:600 11px var(--mono);letter-spacing:.6px;text-transform:uppercase;display:block;margin-bottom:4px;color:var(--ink-soft)}

  /* ---------- Step 5: release ---------- */
  .release{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:start}
  @media (max-width:700px){.release{grid-template-columns:1fr}}
  .receipt{background:#FFFEFA;border:1px solid var(--line);padding:26px 24px 30px;position:relative;font-size:14px;
           box-shadow:0 24px 40px -28px rgba(27,42,65,.45);
           -webkit-mask:radial-gradient(circle 7px at 50% 100%,transparent 6.5px,#000 7px) 0 0/18px 100% repeat-x;
                   mask:radial-gradient(circle 7px at 50% 100%,transparent 6.5px,#000 7px) 0 0/18px 100% repeat-x;}
  .receipt h3{font-family:var(--serif);font-size:20px;margin-bottom:4px}
  .receipt .r{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
  .receipt .r span:first-child{color:var(--ink-soft)}
  .receipt .big{font:700 34px var(--serif);margin:14px 0 6px}
  .receipt.shake{animation:shake .4s ease}
  @keyframes shake{20%{transform:translate(-3px,2px) rotate(-.4deg)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,1px)}80%{transform:translate(1px,0)}}
  .stamp{position:absolute;right:18px;top:92px;padding:8px 18px;border:4px solid var(--stamp);border-radius:10px;color:var(--stamp);
         font:900 44px/1 var(--sans);letter-spacing:6px;transform:rotate(-14deg) scale(2.6);opacity:0;mix-blend-mode:multiply;
         box-shadow:inset 0 0 0 2px var(--stamp);outline:2px solid var(--stamp);outline-offset:3px;
         -webkit-mask:radial-gradient(rgba(0,0,0,.9) 55%,transparent 56%) 0 0/5px 5px,linear-gradient(#000,#000);
         -webkit-mask-composite:source-over}
  .stamp small{display:block;font:700 10px var(--mono);letter-spacing:2px;text-align:center;margin-top:4px}
  .stamp.slam{animation:slam .45s cubic-bezier(.2,.9,.3,1.2) forwards}
  @keyframes slam{0%{opacity:0;transform:rotate(-24deg) scale(2.6)}60%{opacity:.95;transform:rotate(-13deg) scale(.92)}100%{opacity:.88;transform:rotate(-14deg) scale(1)}}
  .ink{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--stamp);opacity:0;pointer-events:none}
  .ink.fly{animation:ink .6s ease-out forwards}
  @keyframes ink{0%{opacity:.8;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
  .payout{font:12px var(--mono);color:var(--ink-soft);margin-top:12px;line-height:1.7;opacity:0}
  .payout.in{animation:enter .5s var(--ease) forwards}
  .ring-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
  .ring{width:170px;height:170px;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:9}
  .ring .bg{stroke:var(--paper-2)}
  .ring .fg{stroke:var(--green);stroke-linecap:round;stroke-dasharray:471;stroke-dashoffset:0;transition:stroke-dashoffset .2s linear}
  .ring .t{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
  .ring .t b{font:600 22px var(--mono)}
  .ring .t small{font-size:11px;color:var(--ink-soft)}
  .ff{font:10.5px var(--mono);color:var(--stamp);letter-spacing:1px}

  /* ---------- Agent log ---------- */
  .log{background:var(--night);color:#C9D4E5;border-radius:18px;padding:16px;font:12px/1.55 var(--mono);min-height:470px;display:flex;flex-direction:column}
  .log-head{display:flex;align-items:center;justify-content:space-between;color:#fff;font-weight:600;font-size:12.5px;margin-bottom:12px;font-family:var(--sans)}
  .live{display:flex;align-items:center;gap:6px;font:11px var(--mono);color:#7FD1AE}
  .live:before{content:"";width:7px;height:7px;border-radius:50%;background:#3DDC97;animation:pulse2 1.4s infinite}
  @keyframes pulse2{50%{opacity:.25}}
  .entries{display:flex;flex-direction:column;gap:8px;overflow:auto;flex:1}
  .entry{padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.04);border-left:2px solid #3DDC97;animation:slide .4s var(--ease) both}
  .entry.pp{border-left-color:#4EA3FF} .entry.err{border-left-color:#FF6B5E} .entry.hook{border-left-color:var(--gold)}
  .entry .who{color:#7FD1AE} .entry.pp .who{color:#8CC4FF} .entry.err .who{color:#FF9A90} .entry.hook .who{color:var(--gold)}
  .entry .ts{color:#5F6F87;float:right}
  .entry .res{color:#8796AD}
  @keyframes slide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
  .empty{color:#5F6F87;font-style:italic}

  /* ---------- Footer controls ---------- */

<script>
const STEPS = ["Brief","Contract","Fund","Verify","Lunas"];
const S = { step:0, token:0, auto:false };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const M = reduce ? 0.25 : 1;
const $ = s => document.querySelector(s);
const stage = $("#stage");

class Cancel extends Error{}
const wait = ms => { const t = S.token; return new Promise((res, rej) => setTimeout(() => t === S.token ? res() : rej(new Cancel()), ms * M)); };
const run = fn => fn().catch(e => { if (!(e instanceof Cancel)) console.error(e); });

/* ---------- step nav ---------- */
function renderNav(){
  $("#steps").innerHTML = STEPS.map((s,i) =>
    `<button class="${i===S.step?'on':''} ${i<S.step?'done':''}" data-i="${i}">${i<S.step?'✓ ':''}${i+1}. ${s}</button>`).join("");
  $("#steps").querySelectorAll("button").forEach(b => b.onclick = () => go(+b.dataset.i));
  $("#back").disabled = S.step === 0;
  $("#next").textContent = S.step === STEPS.length-1 ? "↺ Replay" : "Next →";
}

/* ---------- money rail ---------- */
const POS = ["calc(0% + 40px)", "calc(50% + 40px)", "calc(100% - 40px)"];
function rail(pos, {animate=true, ghost=false, status=""} = {}){
  const coin = $("#coin"), r = $("#rail");
  if (!animate) r.classList.add("no-anim");
  coin.style.left = POS[pos];
  $("#fill").style.width = ["0%","50%","100%"][pos];
  coin.classList.toggle("ghost", ghost);
  [0,1,2].forEach(i => $("#n"+i).classList.toggle("lit", i===pos && !ghost));
  $("#railStatus").innerHTML = status;
  if (animate){ coin.classList.add("moving"); setTimeout(()=>coin.classList.remove("moving"), 1400*M); }
  else { void r.offsetWidth; r.classList.remove("no-anim"); }
}

/* ---------- agent log ---------- */
let t0 = Date.now();
function log(who, msg, res="", kind=""){
  const box = $("#entries"); const empty = box.querySelector(".empty"); if (empty) empty.remove();
  const s = ((Date.now()-t0)/1000).toFixed(1).padStart(5," ");
  const el = document.createElement("div");
  el.className = "entry " + kind;
  el.innerHTML = `<span class="ts">+${s}s</span><span class="who">${who}</span> ${msg}${res?`<div class="res">→ ${res}</div>`:""}`;
  box.appendChild(el); box.scrollTop = box.scrollHeight;
}
function clearLog(text){ $("#entries").innerHTML = `<div class="empty">${text}</div>`; t0 = Date.now(); }

/* ---------- helpers ---------- */
async function type(el, html, speed=22){
  // types plain text, then swaps in highlighted html at the end
  const tmp = document.createElement("div"); tmp.innerHTML = html; const text = tmp.textContent;
  for (let i=1;i<=text.length;i++){ el.textContent = text.slice(0,i); await wait(speed); }
  el.innerHTML = html;
}
const autoClick = async (sel, ms=900) => { if (S.auto){ await wait(ms); const b = $(sel); if (b && !b.disabled) b.click(); } };

function product(kind, bg){
  const p = {
    bottle:`<rect x="42" y="24" width="16" height="12" rx="2" fill="#1B2A41"/><rect x="31" y="35" width="38" height="48" rx="10" fill="#2F6F8F"/><rect x="37" y="52" width="26" height="14" rx="2" fill="#F6F1E7"/>`,
    mug:`<rect x="28" y="40" width="36" height="40" rx="5" fill="#C8372D"/><path d="M64 48h5a9 9 0 0 1 0 18h-5" fill="none" stroke="#C8372D" stroke-width="5"/>`,
    shoe:`<path d="M18 72q2-24 22-24q8 10 22 10q18 2 20 12v6H18z" fill="#1F7A5A"/><rect x="18" y="76" width="64" height="5" rx="2" fill="#1B2A41"/>`,
    bag:`<path d="M38 44q0-15 12-15t12 15" fill="none" stroke="#8A5A2B" stroke-width="4"/><rect x="28" y="42" width="44" height="40" rx="4" fill="#B97A3E"/>`,
    candle:`<rect x="38" y="44" width="24" height="38" rx="3" fill="#E9C46A"/><path d="M50 28q6 8 0 13q-6-5 0-13z" fill="#F28C28"/>`,
    watch:`<rect x="43" y="20" width="14" height="60" rx="4" fill="#56647C"/><circle cx="50" cy="50" r="15" fill="#F6F1E7" stroke="#1B2A41" stroke-width="4"/><path d="M50 50v-8M50 50h6" stroke="#1B2A41" stroke-width="2"/>`,
    plant:`<path d="M50 56q-18-6-16-24q14 4 16 24zM50 56q18-6 16-24q-14 4-16 24z" fill="#2E8B57"/><path d="M36 58h28l-4 24H40z" fill="#C8763A"/>`,
    cap:`<path d="M24 64q0-26 26-26t26 26z" fill="#1B2A41"/><path d="M24 64h48q8 0 8 5H24z" fill="#2F6F8F"/>`
  }[kind];
  return `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="${bg}"/><ellipse cx="50" cy="86" rx="26" ry="3" fill="rgba(0,0,0,.08)"/>${p}</svg>`;
}

    await wait(300);
    log("contract_agent", "extract_criteria()", "4 machine-checkable criteria");
    for (const c of document.querySelectorAll(".chip")){ await wait(220); c.classList.add("in"); }
    await wait(300);
    log("contract_agent", "propose_terms()", "1 milestone · 72h review · auto-release");
    $("#drafting").innerHTML = `<span style="color:var(--green)">✓ Drafted in 2.4s · ambiguity score: low</span>`;

/* =====================================================
   STEP 4 — Verify
   ===================================================== */
const THUMBS = [
  ["bottle","IMG_001"],["mug","IMG_004"],["shoe","IMG_007"],["bag","IMG_009"],
  ["candle","IMG_011"],["watch","IMG_014"],["plant","IMG_016"],["cap","IMG_019"]
];
const BAD = 5;
function step3(){
  rail(1, {animate:false, status:"<b>$150.00 held in escrow</b> · verifying delivery"});
  clearLog("");
  stage.innerHTML = `
  <div class="card enter">
    <div class="eyebrow">Step 4 · Sari delivers · AI verifies</div>
    <h2>Checked against the contract,<br>not against opinions.</h2>
    <div class="verify">
      <div>
        <div class="thumbs" id="thumbs">
          <div class="scan" id="scan"></div>
          ${THUMBS.map(([k,n],i)=>`<div class="thumb" id="t${i}">${product(k, i===BAD?"#D6D2CA":"#FFFFFF")}<span class="nm">${n}</span><span class="badge">${i===BAD?"!":"✓"}</span></div>`).join("")}
          <div class="more">+12</div>
        </div>

    for (let i=0;i<THUMBS.length;i++){ if(i!==BAD) $("#t"+i).classList.add("pass"); }

    log("verify_agent","vision.check_background()","IMG_014: bg #D6D2CA · 21% non-white ✕","err");

/* =====================================================

   ===================================================== */
function step4(){
  rail(1, {animate:false, status:"<b>$150.00 held in escrow</b> · client review window open"});
  clearLog("");
  log("verify_agent","report attached","4/4 criteria ✓");
  stage.innerHTML = `
  <div class="card enter">
    <div class="eyebrow">Step 5 · Release</div>
    <h2>Approved, or auto-released.<br>Either way, Sari gets paid.</h2>
    <div class="release">
      <div class="receipt" id="receipt">
        <h3>Payment Receipt</h3>
        <div class="doc-id">LNS-2026-0142 · Work Agreement</div>
        <div class="big">$150.00</div>
        <div class="r"><span>Paid to</span><span>Sari W. · Yogyakarta</span></div>
        <div class="r"><span>Paid by</span><span>James M. · Austin, TX</span></div>
        <div class="r"><span>Verification</span><span>4 / 4 criteria ✓</span></div>
        <div class="r"><span>Status</span><span id="rstatus">In escrow</span></div>
        <div class="payout" id="payout">payouts.create → batch 5UXD2E8A7EBQJ<br>status: SUCCESS · 6 Nov 2026 21:14 WIB</div>
        <div class="stamp" id="stamp">LUNAS<small>PAID IN FULL</small></div>
      </div>
      <div class="ring-wrap">
        <div class="ring">
          <svg width="170" height="170"><circle class="bg" cx="85" cy="85" r="75"/><circle class="fg" id="arc" cx="85" cy="85" r="75"/></svg>
          <div class="t"><b id="clock">72:00:00</b><small>until auto-release</small></div>
        </div>
        <div class="ff" id="ff">▶▶ TIME-LAPSE</div>
        <button class="btn green" id="approve">✓ Approve & release now</button>
        <p class="muted" style="font-size:12.5px;max-width:240px">If James stays silent, Lunas releases the money automatically when the timer hits zero.</p>
      </div>
    </div>
  </div>`;

  let ticking = true;
  run(async () => {
    const total = 72*3600; let left = total; const arc = $("#arc");
    while (ticking && left > total - 3.6*3600*1.1){
      left -= 137; const h=Math.floor(left/3600), m=Math.floor(left%3600/60), s=left%60;
      $("#clock").textContent = `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
      arc.style.strokeDashoffset = 471*(1-left/total);
      await wait(40);

  $("#approve").onclick = () => run(async () => {
    ticking = false; $("#ff").style.visibility="hidden";
    const b = $("#approve"); b.disabled = true; b.textContent = "Releasing…";
    log("release_policy","client_approved()","James · 3h 52m into window");

    await wait(260);
    rc.classList.add("shake"); splatter(rc, st);
    $("#rstatus").innerHTML = `<b style="color:var(--green)">Paid ✓</b>`;
    $("#payout").classList.add("in");
    log("webhook","PAYMENT.PAYOUTSBATCH.SUCCESS","contract → LUNAS ✓","hook");
    rail(2, {animate:false, status:"<b style='color:var(--green)'>$150.00 paid to Sari ✓</b> · contract closed"});
    b.textContent = "✓ Released";
    const toast = $("#toast"); toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"), 3200);
  });
  run(async () => { await autoClick("#approve", 2600); });
}

function splatter(container, stamp){
  const cr = container.getBoundingClientRect(), sr = stamp.getBoundingClientRect();
  const cx = sr.left - cr.left + sr.width/2, cy = sr.top - cr.top + sr.height/2;
  for (let i=0;i<14;i++){
    const d = document.createElement("span"); d.className = "ink";
    const a = Math.random()*Math.PI*2, r = 50 + Math.random()*70, sz = 2 + Math.random()*5;
    d.style.cssText = `left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r*.6}px`;
    container.appendChild(d); requestAnimationFrame(()=>d.classList.add("fly"));
    setTimeout(()=>d.remove(), 800);
  }
}

/* ---------- router ---------- */
const RENDER = [step0, step1, step2, step3, step4];
function go(i){
  S.token++; S.step = Math.max(0, Math.min(STEPS.length-1, i));
  $("#next").classList.remove("pulse");
  renderNav(); RENDER[S.step]();
}
$("#next").onclick = () => go(S.step === STEPS.length-1 ? 0 : S.step+1);
$("#back").onclick = () => go(S.step-1);
$("#autoBtn").onclick = () => { S.auto = !S.auto; $("#autoBtn").classList.toggle("on", S.auto); if (S.auto) go(S.step === STEPS.length-1 ? 0 : S.step); };
go(0);
</script>
